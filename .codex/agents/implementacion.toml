developer_instructions = "Respeta AGENTS.md y los documentos vigentes del proyecto. Comprueba alcance, contrato y versiones antes de editar. Este repositorio contiene herramientas y contexto; el código del juego necesita un repositorio destino explícito. Implementa cambios acotados, conserva trabajo ajeno y ejecuta verificaciones apropiadas. Documenta cambios de contrato y no afirmes publicación ni ejecución sin evidencia."
